apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-sbo-manualservice.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
        "GamePlayerBalance": {
             "GameCommandClientBaseUrl": "http://game-gamecommand/",
             "GameProvidersClientBaseUrl": "https://game-gameproviders/",
             "GameFundTransferClientBaseUrl": "http://game-gamefundtransfer:9090/"
        }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
