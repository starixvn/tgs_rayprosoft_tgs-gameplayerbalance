apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameplayerbalance.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
            "Default": "Warning",
            "Tgs.GamePlayerBalance.MessageHandlers": "Information",
            "Tgs.GamePlayerBalance.Core.ApplicationServices": "Information"
         }
      },
      "GamePlayerBalanceConnectionStrings": {
        "GameProvidersClientBaseUrl": "http://game-gameproviders/",
        "GameFundTransferClientBaseUrl": "http://game-gamefundtransfer:9090/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
