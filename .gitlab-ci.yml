variables:
  ImageServiceName: pgtgs/game-gameplayerbalance
  SettingServiceKey: game-gameplayerbalance
  HelmTemplateFolderServiceName: game-gameplayerbalance
  BuildCacheKey: Tgs.GamePlayerBalance.$CI_PIPELINE_ID

default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true

unit-test:
  stage: test
  variables:
    DOTNET_USE_POLLING_FILE_WATCHER: "true"
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

push-nuget:
  stage: publish
  needs:
    - build-code
    - unit-test
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  only:
    - main
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.GamePlayerBalance.Client/Tgs.GamePlayerBalance.Client.csproj" --no-restore
    - dotnet nuget push "Tgs.GamePlayerBalance.Client/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Tgs.GamePlayerBalance.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true   
    policy: pull
  script:
    - dotnet build "Tgs.GamePlayerBalance/Tgs.GamePlayerBalance.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageServiceName:$Tag" --no-restore
    - docker push $ImageServiceName:$Tag

push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  script:
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateFolderServiceName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ImageServiceName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderServiceName/values.yaml
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

deploy-dev:
  variables:
    GIT_STRATEGY: none
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$SettingServiceKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated_game})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector_game})
    - export autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.$SettingServiceKey})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderServiceName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderServiceName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF

deploy-staging:
  variables:
    GIT_STRATEGY: none
    namespace: staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_staging
  script:
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$SettingServiceKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated_game})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector_game})
    - export autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.$SettingServiceKey})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderServiceName \
