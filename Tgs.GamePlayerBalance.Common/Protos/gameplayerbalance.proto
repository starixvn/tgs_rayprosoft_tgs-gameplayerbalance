syntax = "proto3";


//import "google/protobuf/timestamp.proto";
//import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/decimal.proto";

option csharp_namespace = "Tgs.GamePlayerBalance.Common.Protos";

package gameplayerbalance;

// The request message containing the user's name.
message BrandAwcAelottoMessageRequest {
    string game_provider_code = 1;
    string brand_code = 2;
}

message BrandAwcAwsMessageRequest {
    string game_provider_code = 1;
    string brand_code = 2;
}

message BrandMessageRequest {
    string game_provider_code = 1;
    string brand_code = 2;
}

message PlayerFormModelRequest {
    int64 id = 1;
}

message BrandFormModelRequest {
    int64 id = 1;
}

message ImportFormModelRequest {
    int64 id = 1;
}

message PlayerBalanceRequest {
     string game_provider_code = 1;
     string player_code = 2;
}

message PlayerBalanceAddRequest {
     string game_provider_code = 1;
     string player_code = 2;
	phoenix.protobuf.DecimalValue balance = 3;
	phoenix.protobuf.DecimalValue free_balance = 4;
	phoenix.protobuf.DecimalValue outstanding_balance = 5;
}


// The response message containing the greetings.
message PlayerBalanceReply {
	phoenix.protobuf.DecimalValue balance = 1;
	phoenix.protobuf.DecimalValue free_balance = 2;
	phoenix.protobuf.DecimalValue outstanding_balance = 3;
}