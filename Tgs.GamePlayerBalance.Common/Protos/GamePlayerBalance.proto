syntax = "proto3";

import "google/protobuf/timestamp.proto";
//import "phoenix/protobuf/guid.proto";
//import "phoenix/protobuf/decimal.proto";

option csharp_namespace = "Tgs.GamePlayerBalance.Common.Protos";

package GamePlayerBalance;

// The request message containing the user's name.
message BrandAwcAelottoMessageRequest {
    string game_provider_code = 1;
    string brand_code = 2;
}

message BrandAwcAwsMessageRequest {
    string game_provider_code = 1;
    string brand_code = 2;
}

message BrandMessageRequest {
    string game_provider_code = 1;
    string brand_code = 2;
}

message PlayerFormModelRequest {
    string game_provider_code = 1;
    string brand_code = 2;
    string player_Code = 3;
    int64 form_id = 4;
}

message BrandFormModelRequest {
    string game_provider_code = 1;
    string brand_code = 2;
    int64 form_id = 3;
}

message BrandTimeFormModelRequest {
    string game_provider_code = 1;
    string brand_code = 2;
    google.protobuf.Timestamp start_time = 3;
    google.protobuf.Timestamp end_time = 4;
    int64 form_id = 5;
}

message GameProviderTimeFormModelRequest {
    string game_provider_code = 1;
    google.protobuf.Timestamp start_time = 2;
    google.protobuf.Timestamp end_time = 3;
    int64 form_id = 4;
}

message ImportFormModelRequest {
    string game_provider_code = 1;
    int64 form_id = 2;
}

// The response message containing the greetings.